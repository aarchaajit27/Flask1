<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Signup{% endblock %}</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center;
           justify-content: center; background: #f0f4f8; }
    .card { background: #fff; width: 100%; max-width: 380px; padding: 32px;
            border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
    h2 { margin: 0 0 20px; text-align: center; color: #1f2937; }
    label { display: block; margin: 14px 0 6px; font-size: 14px; color: #374151; }
    input { width: 100%; padding: 10px; font-size: 15px;
            border: 1px solid #cbd5e1; border-radius: 6px; }
    button, .btn { display: block; width: 100%; margin-top: 20px; padding: 12px;
            font-size: 16px; color: #fff; background: #2563eb; border: none;
            border-radius: 6px; cursor: pointer; text-align: center; text-decoration: none; }
    .error { background: #fee2e2; color: #b91c1c; padding: 10px;
             border-radius: 6px; font-size: 14px; margin-bottom: 8px; }
    .success { color: #16a34a; text-align: center; font-size: 18px; }
  </style>
</head>
<body>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
