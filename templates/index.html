<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #f0f4f8;
    }
    .card {
      background: #fff; width: 100%; max-width: 380px;
      padding: 32px; border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    h2 { margin: 0 0 20px; text-align: center; color: #1f2937; }
    label { display: block; margin: 14px 0 6px; font-size: 14px; color: #374151; }
    input {
      width: 100%; padding: 10px; font-size: 15px;
      border: 1px solid #cbd5e1; border-radius: 6px;
    }
    input:focus { outline: none; border-color: #2563eb; }
    .error { color: #dc2626; font-size: 12px; margin-top: 4px; min-height: 14px; }
    button {
      width: 100%; margin-top: 20px; padding: 12px;
      font-size: 16px; color: #fff; background: #2563eb;
      border: none; border-radius: 6px; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .success { color: #16a34a; text-align: center; margin-top: 14px; font-size: 14px; }
    .login { text-align: center; margin-top: 16px; font-size: 14px; }
    .login a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Create Account</h2>

    <form id="signupForm" novalidate>
      <label for="name">Full name</label>
      <input type="text" id="name" placeholder="Your name">
      <div class="error" id="nameErr"></div>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com">
      <div class="error" id="emailErr"></div>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 8 characters">
      <div class="error" id="passErr"></div>

      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" placeholder="Re-enter password">
      <div class="error" id="confirmErr"></div>

      <button type="submit">Sign Up</button>
      <div class="success" id="success"></div>
    </form>

    <div class="login">Already have an account? <a href="#">Log in</a></div>
  </div>

  <script>
    const form = document.getElementById("signupForm");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const pass = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      // clear old messages
      ["nameErr", "emailErr", "passErr", "confirmErr", "success"]
        .forEach(id => document.getElementById(id).textContent = "");

      let ok = true;

      if (name === "") {
        document.getElementById("nameErr").textContent = "Name is required.";
        ok = false;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById("emailErr").textContent = "Enter a valid email.";
        ok = false;
      }
      if (pass.length < 8) {
        document.getElementById("passErr").textContent = "Password must be 8+ characters.";
        ok = false;
      }
      if (confirm !== pass) {
        document.getElementById("confirmErr").textContent = "Passwords do not match.";
        ok = false;
      }

      if (ok) {
        document.getElementById("success").textContent =
          "Signup successful! (demo only, nothing was sent)";
        form.reset();
      }
    });
  </script>
</body>
</html>
